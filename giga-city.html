<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giga City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
:root{
  --ink:#0c1d2e;
  --panel:rgba(12,29,46,.9);
  --panel-hi:rgba(255,255,255,.06);
  --edge:rgba(190,220,255,.16);
  --text:#f2f6fb;
  --muted:#a2b8cd;
  --gold:#ffc83d;
  --gold-deep:#b87700;
  --green:#74de82;
  --red:#ff7868;
  --amber:#ffb13b;
  --sky:#a9dcf3;
  --display:"Bungee","Arial Black","Segoe UI Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#view.look{cursor:grab}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;box-shadow:0 8px 24px rgba(4,18,32,.28);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 34% 30%,#fff6c4 0 12%,#ffd24d 38%,#e9a300 74%,#b87700 100%);
  box-shadow:inset 0 0 0 .08em #b87700}

/* ---------- top left: money + city ---------- */
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;display:flex;gap:10px;align-items:stretch;z-index:3}
#hud .card{padding:10px 16px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.amount{font-family:var(--display);font-size:30px;line-height:1.05;display:flex;align-items:center;gap:9px;font-variant-numeric:tabular-nums}
.money .amount{color:var(--gold)}
.money .amount.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.08)}}
.sub{font-size:12.5px;color:var(--muted)}
.sub b{color:var(--green);font-weight:700}
.city{width:230px}
.city .amount{font-size:24px}
.city .amount small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;margin-left:2px}
.rankname{font-family:var(--display);font-size:13px;letter-spacing:.02em;color:var(--text)}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.clock{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#63c7ff,#74de82);transition:width .4s}

/* ---------- top right: speed & menu ---------- */
#ctrl{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;display:flex;gap:6px;z-index:3}
#ctrl button{height:36px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
#ctrl button:hover{background:#17324d}
#ctrl .seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--edge);background:var(--panel)}
#ctrl .seg button{border:0;border-radius:0;background:transparent;font-family:var(--display);font-size:12px;min-width:38px}
#ctrl .seg button.on{background:var(--gold);color:#3a2600}
#ctrl svg{width:16px;height:16px;fill:currentColor}
#ctrl .muted{opacity:.45}
#ctrl button.on{background:var(--gold);color:#3a2600;border-color:var(--gold)}
#spec{position:fixed;right:16px;top:calc(60px + env(safe-area-inset-top,0px));width:282px;padding:12px 14px 14px;z-index:4;max-height:calc(100% - 200px);overflow:auto}
.spec-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.spec-head h3{margin:1px 0 0;font-family:var(--display);font-weight:400;font-size:17px}
.spec-head .x{width:28px;height:28px;border-radius:8px;border:1px solid var(--edge);background:transparent;cursor:pointer;font-size:16px;line-height:1}
.ev-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.ev{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:12px;border:2px solid var(--edge);background:var(--panel-hi);cursor:pointer;font-weight:700;font-size:12.5px}
.ev .big{font-size:22px;line-height:1}
.ev:hover{background:rgba(255,255,255,.1)}
.ev.on{border-color:var(--gold);background:rgba(255,200,61,.14)}
.spec-note{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.4}
.spec-note b{color:var(--text)}

/* ---------- goals ---------- */
#goals{position:fixed;left:16px;top:calc(112px + env(safe-area-inset-top,0px));width:262px;padding:10px 12px 12px;z-index:2;
  max-height:calc(100% - 290px);overflow:auto}
.goals-head{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:0 0 6px;cursor:pointer}
.goals-head .count{font-family:var(--display);font-size:12px;color:var(--gold)}
#goalList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#goalList li{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.3;color:var(--muted)}
#goalList li .tick{flex:0 0 16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);margin-top:1px;position:relative}
#goalList li.done{color:rgba(162,184,205,.6);text-decoration:line-through;text-decoration-color:rgba(162,184,205,.5)}
#goalList li.done .tick{background:var(--green);border-color:var(--green)}
#goalList li.done .tick::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #0c3a1a;border-width:0 2px 2px 0;transform:rotate(45deg)}
#goalList li.now{color:var(--text);font-weight:700}
#goalList li.now .tick{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.2)}
#goals.collapsed li:not(.now){display:none}

/* ---------- info panel ---------- */
#info{position:fixed;right:16px;top:calc(60px + env(safe-area-inset-top,0px));width:282px;padding:12px 14px 14px;z-index:2;
  max-height:calc(100% - 240px);overflow:auto}
.info-head{display:flex;gap:10px;align-items:center}
.info-head img,.info-head .ico{width:52px;height:52px;flex:0 0 52px;border-radius:10px;background:rgba(169,220,243,.12)}
.info-head h3{margin:1px 0 0;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15;text-wrap:balance}
.info-head .x{margin-left:auto;align-self:flex-start;width:28px;height:28px;border-radius:8px;border:1px solid var(--edge);background:transparent;cursor:pointer;font-size:16px;line-height:1}
#info p{margin:9px 0 0;line-height:1.45;color:#d8e3ee}
.price-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;background:var(--panel-hi);font-weight:700;font-size:12.5px}
.pill.cost{color:var(--gold);font-family:var(--display);font-weight:400}
.pill.back{color:var(--green)}
.chip{margin-top:10px;padding:7px 10px;border-radius:10px;font-weight:700;font-size:13px;line-height:1.3;border-left:4px solid}
.chip.ok{background:rgba(116,222,130,.12);border-color:var(--green);color:#c9f5cf}
.chip.bad{background:rgba(255,120,104,.14);border-color:var(--red);color:#ffd4ce}
.chip.warn{background:rgba(255,177,59,.14);border-color:var(--amber);color:#ffe2b5}
.facts{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:10px 0 0;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.gold{background:var(--gold);color:#3a2600}
.btn.gold:disabled{background:#5a5236;color:#b3a57a;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--text)}
.btn.danger{background:transparent;border:1px solid rgba(255,120,104,.5);color:#ffb3a8}
.btn.danger.armed{background:var(--red);color:#3a0800;border-color:var(--red)}

/* ---------- toolbar ---------- */
#toolbar{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:3}
.tools{pointer-events:auto;display:flex;gap:4px;padding:7px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;
  overflow-x:auto;max-width:100%;scrollbar-width:thin;box-shadow:0 10px 30px rgba(4,18,32,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tool{flex:0 0 auto;width:80px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 3px 7px;border-radius:12px;
  border:2px solid transparent;background:transparent;cursor:pointer;position:relative}
.tool:hover{background:var(--panel-hi)}
.tool .th{width:56px;height:56px;display:block}
.tool .th svg{width:100%;height:100%}
.tool .nm{font-size:12px;font-weight:700;line-height:1.15;white-space:nowrap}
.tool .pr{font-family:var(--display);font-size:13px;color:var(--gold);display:flex;align-items:center;gap:4px;line-height:1.2}
.tool .pr .coin{font-size:12px}
.tool .meta{font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap;font-weight:700}
.tool .meta .bk{color:var(--green)}
.pi{width:9px;height:11px;fill:currentColor;vertical-align:-1px}
.tool .key{position:absolute;top:4px;left:6px;font-family:var(--display);font-size:10px;color:rgba(162,184,205,.7)}
.tool.on{border-color:var(--gold);background:rgba(255,200,61,.13)}
.tool.poor .pr{color:var(--red)}
.tool.poor .th{filter:grayscale(.75) opacity(.55)}

/* ---------- floating coins, tip, toasts, banner ---------- */
#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.fl{position:absolute;left:0;top:0;font-family:var(--display);font-size:15px;color:var(--gold);white-space:nowrap;
  text-shadow:0 2px 0 rgba(40,24,0,.55),0 0 8px rgba(0,0,0,.25);will-change:transform,opacity}
.fl.spend{color:#ff9d90;text-shadow:0 2px 0 rgba(60,0,0,.5)}
.fl.back{color:#8ff09b;text-shadow:0 2px 0 rgba(0,40,10,.55)}
#tip{position:fixed;left:0;top:0;pointer-events:none;z-index:4;background:rgba(8,22,36,.94);border:1px solid var(--edge);border-radius:8px;
  padding:5px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
#tip.bad{border-color:var(--red);color:#ffd4ce}
#tip.warn{border-color:var(--amber);color:#ffe2b5}
#tip.ok{border-color:rgba(116,222,130,.6)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:rgba(8,22,36,.95);border:1px solid var(--edge);border-left:4px solid var(--muted);border-radius:10px;padding:8px 12px;font-weight:700;
  font-size:13px;line-height:1.35;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:100%}
.toast.bad{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--amber)}
.toast.good{border-left-color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;width:calc(100% - 32px)}
#banner .t1{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#banner .t2{font-family:var(--display);font-size:clamp(30px,6vw,58px);line-height:1.05;color:var(--gold);
  text-shadow:0 4px 0 var(--gold-deep),0 10px 30px rgba(0,0,0,.35);text-wrap:balance}
#banner .t3{margin-top:6px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#banner.show{animation:bannerIn 3.4s ease-out forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-40%) scale(.85)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
  18%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%)}}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,rgba(8,24,40,.35),rgba(8,24,40,.7))}
.sheet{width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;background:rgba(10,26,42,.97);border:1px solid var(--edge);border-radius:20px;
  padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.logo{font-family:var(--display);font-size:clamp(40px,9vw,64px);line-height:.95;color:var(--gold);letter-spacing:.01em;
  text-shadow:0 4px 0 var(--gold-deep),0 12px 30px rgba(0,0,0,.35);margin:0}
.logo small{display:block;font-family:var(--body);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:10px;font-weight:700}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;color:var(--gold)}
.sheet p,.sheet li{line-height:1.5;color:#d8e3ee}
.sheet ul{padding-left:20px;margin:14px 0}
.sheet li{margin:4px 0}
.sheet .keys{font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px}
kbd{font-family:var(--display);font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);color:var(--text)}
.sheet .actions{margin-top:18px}
.sheet .btn{padding:12px 18px;font-size:15px}
.tbl-wrap{overflow-x:auto;margin-top:12px}
.prices{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
.prices th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--edge)}
.prices td{padding:6px 8px;border-bottom:1px solid rgba(190,220,255,.07);font-variant-numeric:tabular-nums;color:#e3ecf5}
.prices td.n{text-align:right;font-weight:700}
.prices td.g{color:var(--gold)}
.prices td.b{color:var(--green)}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--sky);color:#12324f;
  font-family:var(--display);font-size:22px;text-align:center;padding:0 16px}

@media (max-width:1150px){ #toasts{top:calc(126px + env(safe-area-inset-top,0px))} }
@media (max-width:820px){
  #hud{right:16px;gap:8px}
  #hud .card{padding:8px 11px;flex:1 1 0}
  .amount{font-size:22px}
  .city{width:auto}
  .city .amount{font-size:19px}
  #nextRank{display:none}
  .clock .long{display:none}
  #info.idle{display:none}
  #spec{top:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px));left:16px;right:16px;width:auto;max-height:55%}
  .ev-list{grid-template-columns:repeat(3,1fr)}
  #ctrl{top:calc(94px + env(safe-area-inset-top,0px))}
  #ctrl button{height:32px;min-width:32px;padding:0 8px}
  #ctrl .seg button{min-width:32px}
  #goals{top:calc(94px + env(safe-area-inset-top,0px));width:auto;right:300px;max-height:40%}
  #goals:not(.collapsed){right:16px;z-index:4}
  #info{top:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px));left:16px;right:16px;width:auto;max-height:36%}
  #info p{font-size:13px}
  .tool{width:72px}
  .tool .th{width:44px;height:44px}
  #toasts{top:calc(138px + env(safe-area-inset-top,0px))}
}
@media (max-width:520px){
  #goals{right:16px;top:calc(134px + env(safe-area-inset-top,0px))}
  #toasts{top:calc(178px + env(safe-area-inset-top,0px))}
  .sub{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){
  .money .amount.bump,#banner.show,.toast{animation:none}
  #banner.show{opacity:1}
}
</style>

<canvas id="view" aria-label="Your city, shown in 3D"></canvas>
<div id="floaters" aria-hidden="true"></div>
<div id="tip" hidden></div>

<header id="hud">
  <div class="card money">
    <div class="label">Coins</div>
    <div class="amount" id="coinBox"><span class="coin" aria-hidden="true"></span><span id="coins">130</span></div>
    <div class="sub"><b id="income">+0</b> coins per minute</div>
  </div>
  <div class="card city">
    <div class="rank-row"><span class="rankname" id="rank">Empty Land</span><span class="clock" id="clock">☀️ Day 1 · 2:00</span></div>
    <div class="amount"><span id="pop">0</span><small>people</small></div>
    <div class="bar"><i id="rankBar"></i></div>
    <div class="sub" id="nextRank">5 more people to become a Hamlet</div>
  </div>
</header>

<div id="ctrl">
  <div class="seg" role="group" aria-label="Game speed">
    <button data-speed="0" title="Pause (P)" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg></button>
    <button data-speed="1" class="on" title="Normal speed">1×</button>
    <button data-speed="2" title="Fast">2×</button>
    <button data-speed="4" title="Super fast">4×</button>
  </div>
  <button id="soundBtn" title="Sound on or off" aria-label="Sound"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3.5v11L5 10H2z"/><path d="M11 5.2a4 4 0 0 1 0 5.6l-.9-.9a2.7 2.7 0 0 0 0-3.8zM12.8 3.4a6.5 6.5 0 0 1 0 9.2l-.9-.9a5.2 5.2 0 0 0 0-7.4z"/></svg></button>
  <button id="helpBtn" title="How to play" aria-label="How to play">?</button>
  <button id="specBtn" title="Spectator mode" aria-label="Spectator mode" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M8 3.2C4.4 3.2 1.7 5.6.6 8c1.1 2.4 3.8 4.8 7.4 4.8s6.3-2.4 7.4-4.8C14.3 5.6 11.6 3.2 8 3.2zm0 7.8a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-1.6a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8z"/></svg></button>
  <button id="restartBtn" title="Restart: remove everything you built and start again with 130 coins">Restart</button>
</div>

<aside id="goals" class="card">
  <button class="goals-head" id="goalsToggle" aria-expanded="true"><span class="label">City goals</span><span class="count" id="goalCount">0 / 12</span></button>
  <ol id="goalList"></ol>
</aside>

<aside id="info" class="card" aria-live="polite"></aside>
<aside id="spec" class="card" hidden></aside>

<nav id="toolbar" aria-label="Build"><div class="tools" id="tools"></div></nav>
<div id="toasts" aria-live="polite"></div>
<div id="banner" hidden><div class="t1">New city level</div><div class="t2" id="bannerTitle"></div><div class="t3" id="bannerSub"></div></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="loading">Building your island…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const THREE = window.THREE;
const $ = s => document.querySelector(s);
const loadingEl = $('#loading');
if (!THREE) { loadingEl.textContent = "The 3D engine didn't load. Check your internet connection, then reload the page."; return; }

/* =====================================================================
   RULES
   ===================================================================== */
const N = 48, HALF = N / 2;
const START_COINS = 130, STREET_COST = 10, CAR_COST = 30;
const WALK = 1.0, DRIVE = 3.4;            // fields per second on short trips
const TRIP_WALK = 5, TRIP_DRIVE = 1.2;    // longest one-way trip in seconds: on longer streets people hurry up
const PAY_EVERY = 5, PAY_AMOUNT = 2;      // everything that earns coins pays 2 coins every 5 seconds by itself (daytime only)
const SCHOOL_STAY = 20;                   // seconds a kid stays at school
const REST_MIN = 30, REST_RAND = 15;      // after a trip, people stay home 30–45 s before going out again (keeps the money from people low)
const DAY_LEN = 120, NIGHT_LEN = 120;     // a day lasts 2 minutes, and so does a night

  if (keys.a || keys.arrowleft) fx -= 1; if (keys.d || keys.arrowright) fx += 1;
  let moved = false;
  if (fx || fz) {
    const sp = cam.dist * 0.9 * dt, sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
    cam.tx += (fx * cy + fz * sy) * sp; cam.tz += (-fx * sy + fz * cy) * sp; clampTarget(); moved = true;
  }
  if (keys.q) { cam.yaw += 1.6 * dt; moved = true; }
  if (keys.e) { cam.yaw -= 1.6 * dt; moved = true; }
  if (keys['+'] || keys['=']) { cam.dist = clamp(cam.dist * (1 - dt * 1.2), 2.2, 85); moved = true; }
  if (keys['-'] || keys['_']) { cam.dist = clamp(cam.dist * (1 + dt * 1.2), 2.2, 85); moved = true; }

function calendarEvents() {
  const d = new Date(), m = d.getMonth(), s = new Set();

function refreshEvents() {

  const was = EV, wasFools = FOOLS;
  EV = next; FOOLS = EV.has('fools');
  for (const e of EV) if (!was.has(e)) toast(EVENT_INFO[e].start, 'good');
  if (was.has('christmas') !== EV.has('christmas') || wasFools !== FOOLS) for (let i = 0; i < N * N; i++) setTile(i);   // snow or cheese comes or goes

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
let lastT = performance.now(), hudT = 0, slowT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const dt = started && modal.hidden ? rdt * S.speed : 0;
  if (dt > 0) simStep(dt);
  stepCamAnim(rdt);
  keyboardCamera(rdt);
  for (const b of animating) {
    b.anim += rdt; const k = Math.min(1, b.anim / 0.45);
    b.s = Math.max(0.01, easeOutBack(k)); KINDS[b.type].update(b); if (b.car) PARKED.update(b);
    if (k >= 1) { b.s = 1; KINDS[b.type].update(b); if (b.car) PARKED.update(b); animating.delete(b); }
  }
  const tt = now / 1000;
  for (const b of iconed) if (b.icon) b.icon.position.y = TYPES[b.type].h + 0.38 + Math.sin(tt * 3 + b.x) * 0.05;
  if (selMesh.visible) { const s = 1 + Math.sin(tt * 4) * 0.03; selMesh.scale.set(s, 1, s); }
  waterMat.emissiveIntensity = 0.32 + Math.sin(tt * 1.7) * 0.07;
  for (const c of clouds) { const u = c.userData; u.a += u.v * rdt; c.position.x = Math.cos(u.a) * u.r; c.position.z = Math.sin(u.a) * u.r; }
  if (streetsDirty) { rebuildStreets(); streetsDirty = false; }
  drawPeople(); drawBowling(); updateEvents(dt, rdt, tt);
  updateFloaters(rdt);
  updateHover();
  hudT -= rdt; if (hudT <= 0) { hudT = 0.15; updateHUD(); }
  slowT -= rdt; if (slowT <= 0) { slowT = 0.5; updateStatus(); checkGoals(); refreshInfo(); stuckHint(); refreshEvents(); }
  updateSky();
  renderer.render(scene, camera);
}

async function main(hot) {
  try { await Promise.race([document.fonts ? document.fonts.load('60px Bungee') : null, new Promise(r => setTimeout(r, 1800))]); } catch (e) {}
  buildAssets();
  carBodies = inst(CAR.body, carBodyMat, MAXC, { color: true });
  carDets = inst(CAR.det, vcMat, MAXC);
  ghostCar = new THREE.Group(); ghostCar.add(new THREE.Mesh(CAR.body, ghostMat)); ghostCar.visible = false; scene.add(ghostCar);
  makeThumbs();
  buildToolbar();
  const hotSave = hot && hot.save;
  const local = hotSave ? null : readLocal();
  if (hotSave) loadSave(hotSave);
  else if (local && local.v === 1) loadSave(local);
  else newGame();
  renderGoals(); checkGoals(); updateHUD();
  S.rank = rankIndex(S.pop);
  loadingEl.remove();
  if (hotSave) { started = true; renderInfo(); }
  else showWelcome(!!(local && local.v === 1));

}

window.gigaCity = { S, get persons() { return persons; }, placeStreet, placeBuilding, buyCar, bulldoze, cam, applyCamera, setSpeed, serialize, loadSave,
  tick(sec) { for (let t = 0; t < sec; t += 0.05) { simStep(0.05); updateEvents(0.05, 0.05, S.time); } drawPeople(); drawBowling(); updateHUD(); updateStatus(); checkGoals(); refreshEvents(); },
  refreshEvents, get EV() { return EV; }, get santa() { return santa.position; }, get bunny() { return bunny.position; }, get eggs() { return huntEggs.length; }, get bigEggs() { return bigEggs.map(e => ({ x: e.mesh.position.x, z: e.mesh.position.z, visible: e.mesh.visible, tile: e.tile })); },
  frameMs() { const a = performance.now(); drawPeople(); renderer.render(scene, camera); renderer.getContext().finish(); return performance.now() - a; } };

})();
